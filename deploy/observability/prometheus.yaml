global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 15s
  external_labels:
    deployment: local-gortex

scrape_configs:
  - job_name: gortex
    follow_redirects: false
    static_configs:
      - targets: [127.0.0.1:9474]
    sample_limit: 20000
    label_limit: 20
    label_value_length_limit: 256
    body_size_limit: 8MB
