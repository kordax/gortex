name: gortex-observability

# Native Linux host networking reaches the daemon's loopback-only endpoint.
# Every listener is explicitly loopback-bound; ports: has no effect in this mode.
x-runtime: &runtime
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

services:
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.15.0
    cpus: 1.0
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    tmpfs: [/tmp]

  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.4
    cpus: 1.0
    mem_limit: 512m
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: [/tmp]

  tempo:
    <<: *runtime
    profiles: [tracing]
    image: grafana/tempo:3.1.0
    cpus: 1.0
    mem_limit: 1g
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    tmpfs: [/tmp]

secrets:
  grafana_admin_password:
    file: ./.state/grafana-password

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
