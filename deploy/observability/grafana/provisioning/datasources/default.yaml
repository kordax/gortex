apiVersion: 1
prune: true
datasources:
  - name: Gortex Prometheus
    uid: gortex-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST
  - name: Gortex Tempo (optional)
    uid: gortex-tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: false
